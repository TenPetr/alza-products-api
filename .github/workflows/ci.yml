# Builds the solution and runs all tests, the SQL Server ones included (GitHub's Ubuntu runners have Docker)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Reading the repository is all this workflow needs
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit hashes, so a moved tag can't change what runs
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Warnings fail the build (TreatWarningsAsErrors in Directory.Build.props)
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
